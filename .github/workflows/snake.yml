name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 자정 (UTC)
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: SeongjunLee4473
          outputs: |
            dist/github-snake.svg?color_snake=#7A30FF&color_dots=#ebedf0,#bfd6f6,#8dbdff,#64a1f4,#3173d9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#0e4429,#1f6feb,#388bfd,#79c0ff

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
